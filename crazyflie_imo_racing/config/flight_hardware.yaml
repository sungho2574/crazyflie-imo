# Unvalidated hardware starting profile. Measure mass/motor scale/noise before flight.
# CFSim model retained; onboard position sensing (Flow deck or mocap) needed for takeoff.
imo_flight:
  ros__parameters:
    robot: cf231
    backend: cflib
    sensor_profile: hardware
    firmware_controller: mellinger
    imo_repo: /home/artemis-2/crazyflie/learned_inertial_model_odometry
    checkpoint: ''
    model_parameters: ''
    trajectory: hover
    yaw_mode: forward
    trajectory_csv: ''
    timescale: 1.0
    initial_position:
    - 0.0
    - 0.0
    - 0.0
    initial_yaw_deg: 0.0
    height: 1.0
    radius: 1.0
    period: 3.0
    ramp_duration: 2.0
    laps: 1
    takeoff_duration: 4.0
    settle_duration: 2.0
    land_duration: 4.0
    mass: 0.034
    thrust_scale: 1.0
    accel_scale: 1.0
    update_freq: 20.0
    displacement_sigma:
    - 0.3
    - 0.3
    - 0.3
    initial_attitude_sigma_deg: 2.0
    initial_yaw_sigma_deg: 5.0
    initial_velocity_sigma: 0.1
    innovation_gate: 7.815
    max_position_correction: 0.1
    max_velocity_correction: 0.1
    max_attitude_correction_deg: 0.5
    sigma_na: 0.1
    sigma_ng: 0.001
    sigma_nba: 0.01
    sigma_nbg: 0.0001
    calibration_samples: 100
    sensor_pair_tolerance_ms: 5
    sensor_max_gap: 0.05
    watchdog_seconds: 0.3
    max_distance: 5.0
    max_speed: 5.0
    max_tracking_error: 3.0
    max_tilt_deg: 20.0
    max_pwm: 60000
    kp:
    - 2.0
    - 2.0
    - 4.0
    kd:
    - 2.0
    - 2.0
    - 2.5
    min_battery: 3.7
    autostart: false
    exit_on_complete: false
    log_dir: ~/flight_logs/imo
