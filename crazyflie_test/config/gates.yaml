# 자동 생성 파일 - gate_map.py 실행 결과
# mount_z: 게이트 하단(거치) 높이 [m]
# 통과 고도(게이트 중심) = mount_z + 0.25
# yaw_deg: 게이트 통과 방향(법선)의 방위각, x축 기준 **CW(위에서 봤을 때 시계방향)**
#          → 진행 방향 = (cos(-yaw_deg), sin(-yaw_deg)). gate_map.py yaw_rad() 와 동일.
#          (이전 주석에 CCW 라고 적혀 있었으나 생성기와 반대라 바로잡음.
#           gate_map.py 의 헤더 출력 부분도 같이 고칠 것)
room:
  size_x: 8.0
  size_y: 11.0
  height: 2.01
  safety_margin: 1.5
# 이륙/착륙 지점. 실제 기체를 이 좌표(바닥)에 놓고 시작한다.
# 게이트 1 은 yaw 270 = CW 기준 +y 통과이므로 "게이트 앞"은 남쪽(y < -2.5)이다.
# 진입선(x=2.5) 위에 두어 이륙 후 첫 통과가 직선이 되게 잡았다.
# ⚠️ crazyflies_*.yaml 의 initial_position 을 [x, y, 0.0] 으로 맞춰야 한다.
#    (gate_flight 가 실행 전에 검사하고, 다르면 멈춘다)
start:
  x: 2.5
  y: -3.4
  takeoff_z: 1.25       # 이륙 후 호버 고도 [m]. 게이트 통과 고도와 같게
gate:
  inner_size: 0.5           # 게이트 개구부 한 변 [m] (물리 크기)
  frame_thickness: 0.08
  allowed_mount_z: [0.0, 0.5, 1.0]
  # 궤적을 게이트 중앙 쪽으로 얼마나 좁혀 통과시킬지 — 실기체 충돌 방지용.
  # TOGT 는 궤적(=기체 중심)이 아래 '유효 창' 안으로 지나도록 계획한다.
  #   유효 창 반폭 = inner_size/2 − (drone_radius + frame_margin)
  #   → 기체 프로펠러 끝이 프레임에서 frame_margin 이상 떨어진다.
  drone_radius: 0.06        # 크플 반경(프로펠러 끝까지) [m]. CF2.1 ≈ 0.06
  frame_margin: 0.10        # 프레임 안쪽 ~ 프로펠러 끝 최소 여유 [m]
  #   기본값이면 0.5 게이트에서 유효 창 = 0.5 − 2·(0.06+0.10) = 0.18 m,
  #   궤적 중심이 중앙 ±0.09 m, 프로펠러 끝이 프레임에서 0.10 m 뜬다.
  #   더 타이트(가운데로): frame_margin ↑. 더 여유롭게(빠르게): frame_margin ↓.
gates:
  - {id: 1, x: 2.5, y: -2.5, mount_z: 1.0, yaw_deg: 270}
  - {id: 2, x: 0.5, y: 3.5, mount_z: 1.0, yaw_deg: 310}
  - {id: 3, x: 2.5, y: 2.5, mount_z: 1.0, yaw_deg: 60}
  - {id: 4, x: -0.5, y: -0.5, mount_z: 1.0, yaw_deg: 180}
  - {id: 5, x: -2.0, y: 4.0, mount_z: 1.0, yaw_deg: 270}
  - {id: 6, x: -2.0, y: 4.0, mount_z: 0.5, yaw_deg: 90}
  - {id: 7, x: -2.0, y: -3.0, mount_z: 1.0, yaw_deg: 30}